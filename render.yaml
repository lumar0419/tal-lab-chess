services:
  - type: web
    name: tal-lab-chess
    runtime: python
    plan: free
    region: singapore
    buildCommand: "python -m compileall -q ."
    startCommand: "python cloud_server.py"
    healthCheckPath: /healthz
    envVars:
      - key: TAL_SITE_USER
        value: player
      - key: TAL_SITE_PASSWORD
        sync: false
