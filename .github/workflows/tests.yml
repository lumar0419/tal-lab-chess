name: Tal Lab regression
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install chess==1.11.2
      - run: python -m unittest discover -q
      - run: python test_engine.py --quick
      - run: python test_uci.py
      - run: node --check web/analysis.js && node --check web/engine-worker.js && node test_visuals.js && node test_frontend.js
