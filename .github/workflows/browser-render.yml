name: Browser-only Render test site
on: [workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/prepare_web_runtime.py
      - run: python -m unittest -q test_render_deployment
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
